<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>온바탕으로 옮겼어요</title>
  <!-- 이 저장소(hichoni/minican)는 hichoni/onbatang 으로 옮겼어요. 예전 주소로 들어오면 같은 자리의 새 주소로 보낸다.
       같은 hichoni.github.io 주소 안이라 이 기기에 저장된 그림은 새 주소에서도 그대로 보인다. -->
  <meta http-equiv="refresh" content="0; url=https://hichoni.github.io/onbatang/app/" />
  <link rel="canonical" href="https://hichoni.github.io/onbatang/app/" />
  <script>location.replace(location.href.replace(/\/minican(\/|$)/, '/onbatang/'));</script>
</head>
<body style="font-family: system-ui, sans-serif; padding: 24px;">
  <p>온바탕이 새 주소로 옮겼어요. <a href="https://hichoni.github.io/onbatang/app/">https://hichoni.github.io/onbatang/app/</a></p>
</body>
</html>

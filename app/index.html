<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>온바탕 — 생각을 펼치는 따뜻한 디자인 공간</title>
  <meta name="description" content="글·도형·사진을 놓고 끌어서 카드·포스터·발표 자료를 꾸며요. 여러 장을 만들어 발표하고, 그림이나 영상 파일로 내려받아요." />
  <meta name="theme-color" content="#286f62">
  <meta name="application-name" content="온바탕">
  <link rel="icon" type="image/svg+xml" href="./brand/app-icon.svg?v=b1">
  <link rel="apple-touch-icon" href="./brand/app-icon-192.png?v=b1">
  <link rel="stylesheet" href="../src/minicanva.css" />
  <link rel="stylesheet" href="./app.css" />
  <link rel="stylesheet" href="./brand.css" />
</head>
<body class="mc-app">
  <main id="app"><div class="mc-boot" role="status"><img class="onba-boot-mark" src="./brand/app-icon.svg?v=b1" width="64" height="64" alt=""><p>온바탕을 여는 중이에요…</p></div></main>
  <script type="module">
    // 미니캔 앱 시작하기. 들여 쓰는 곳에서는 이 쪽을 본떠 글꼴 목록(그 프로젝트가 가진 글꼴 파일)과 저장소 이름만 바꾼다.
    // 시연용 글꼴은 demo/fonts/ 의 OFL 글꼴이다(전문은 demo/fonts/OFL.txt).
    import { startMinican } from './app.js';

    startMinican({
      fonts: [
        { id: 'do-hyeon', name: '도현', desc: '굵고 반듯해요', url: '../demo/fonts/do-hyeon.ttf' },
        { id: 'jua', name: '주아', desc: '둥글고 귀여워요', url: '../demo/fonts/jua.ttf' },
        { id: 'single-day', name: '싱글데이', desc: '손글씨 느낌', url: '../demo/fonts/single-day.ttf' },
      ],
      titleFont: 'do-hyeon',
      storage: 'minican',
    });
  </script>
</body>
</html>
